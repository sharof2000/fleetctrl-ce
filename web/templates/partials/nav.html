{{define "partials/nav"}}
<!-- Navigation -->
<nav class="bg-white/80 dark:bg-surface-dark-secondary/80 backdrop-blur-lg border-b border-slate-200 dark:border-slate-800/50 sticky top-0 z-50 transition-colors duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center gap-8">
                <!-- Logo -->
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 flex items-center justify-center">
                        <svg width="100%" height="100%" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="10" y="10" width="38" height="45" rx="6" fill="#60A5FA" />
                            <rect x="10" y="60" width="38" height="30" rx="6" fill="#BFDBFE" />
                            <rect x="53" y="10" width="37" height="30" rx="6" fill="#93C5FD" />
                            <rect x="53" y="45" width="37" height="45" rx="6" fill="#3B82F6" />
                        </svg>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-slate-900 to-slate-600 dark:from-white dark:to-slate-400" style="line-height: 1;">FleetCtrl</span>
                        <span class="text-[11px] text-slate-400 dark:text-slate-500 font-mono" style="line-height: 1;" x-text="'v' + version"></span>
                    </div>
                </div>

                <!-- Nav Links -->
                <div class="hidden md:flex items-center space-x-1">
                    <a href="/dashboard" class="px-4 py-2 rounded-md font-medium text-sm transition-all {{if eq .ActivePage "dashboard"}}bg-primary-50 dark:bg-primary-900/10 text-primary-600 dark:text-primary-400{{else}}text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 hover:bg-slate-50 dark:hover:bg-surface-dark-tertiary/50{{end}}">Dashboard</a>
                    <a href="/applications" class="px-4 py-2 rounded-md font-medium text-sm transition-all text-slate-400 dark:text-slate-500 hover:text-slate-500 dark:hover:text-slate-400 hover:bg-slate-50 dark:hover:bg-surface-dark-tertiary/50">
                        <span class="flex items-center gap-1.5">Applications
                            <span class="text-[10px] px-1.5 py-0.5 rounded bg-primary-100 dark:bg-primary-900/30 text-primary-600 dark:text-primary-400 font-semibold">Soon</span>
                        </span>
                    </a>
                    <a href="/files" class="px-4 py-2 rounded-md font-medium text-sm transition-all text-slate-400 dark:text-slate-500 hover:text-slate-500 dark:hover:text-slate-400 hover:bg-slate-50 dark:hover:bg-surface-dark-tertiary/50">
                        <span class="flex items-center gap-1.5">Files
                            <span class="text-[10px] px-1.5 py-0.5 rounded bg-primary-100 dark:bg-primary-900/30 text-primary-600 dark:text-primary-400 font-semibold">Soon</span>
                        </span>
                    </a>
                    <a href="/services" class="px-4 py-2 rounded-md font-medium text-sm transition-all text-slate-400 dark:text-slate-500 hover:text-slate-500 dark:hover:text-slate-400 hover:bg-slate-50 dark:hover:bg-surface-dark-tertiary/50">
                        <span class="flex items-center gap-1.5">Services
                            <svg class="w-3.5 h-3.5 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </span>
                    </a>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <!-- User Profile Dropdown -->
                <div class="relative" x-data="{ open: false }" @click.away="open = false" @keydown.escape.window="open = false">
                    <button @click="open = !open" type="button"
                        class="group flex items-center gap-2 px-1 py-1 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors focus:outline-none focus:ring-2 focus:ring-primary-500/20"
                        :aria-expanded="open.toString()" aria-haspopup="true">
                        <div class="h-9 w-9 rounded-full bg-gradient-to-tr from-primary-500 to-indigo-600 flex items-center justify-center text-white shadow-md ring-2 ring-white dark:ring-slate-800 group-hover:ring-primary-200 dark:group-hover:ring-primary-700/50 transition-all">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                        <svg class="w-4 h-4 text-slate-400 group-hover:text-slate-600 dark:text-slate-500 dark:group-hover:text-slate-300 transition-colors hidden sm:block"
                            :class="open ? 'rotate-180' : ''"
                            fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>

                    <div x-show="open"
                        x-transition:enter="transition ease-out duration-200"
                        x-transition:enter-start="opacity-0 translate-y-2 scale-95"
                        x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                        x-transition:leave="transition ease-in duration-150"
                        x-transition:leave-start="opacity-100 translate-y-0 scale-100"
                        x-transition:leave-end="opacity-0 translate-y-2 scale-95"
                        class="absolute right-0 mt-2 w-64 origin-top-left rounded-md bg-white/90 dark:bg-slate-800/90 backdrop-blur-xl shadow-xl border border-slate-200/60 dark:border-slate-700/60 py-2 z-50 ring-1 ring-black/5 focus:outline-none"
                        style="max-width: calc(100vw - 2rem);"
                        role="menu" aria-orientation="vertical" tabindex="-1" x-cloak>

                        <!-- Theme Toggle -->
                        <div class="px-2 py-1">
                            <button @click="ThemeManager.toggle()"
                                class="w-full group flex items-center justify-between px-3 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-white/5 rounded-md transition-colors"
                                role="menuitem">
                                <div class="flex items-center gap-3">
                                    <div class="p-1.5 rounded-md bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 group-hover:bg-indigo-50 dark:group-hover:bg-indigo-900/20 transition-colors">
                                        <svg class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                                        </svg>
                                        <svg class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                                        </svg>
                                    </div>
                                    <span class="font-medium">Theme</span>
                                </div>
                                <!-- Toggle Switch Visual -->
                                <div class="relative inline-flex h-5 w-9 items-center rounded-full transition-colors duration-200 ease-in-out bg-slate-200 dark:bg-primary-600">
                                    <span class="translate-x-0.5 dark:translate-x-4 inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
                                </div>
                            </button>
                        </div>

                        <div class="my-1 border-t border-slate-200/60 dark:border-slate-700/60 mx-4"></div>

                        <!-- Change Password -->
                        <div class="px-2 py-1">
                            <button @click="showPasswordModal = true; open = false"
                                class="w-full group flex items-center gap-3 px-3 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-white/5 rounded-md transition-colors"
                                role="menuitem">
                                <div class="p-1.5 rounded-md bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 group-hover:bg-indigo-50 dark:group-hover:bg-indigo-900/20 transition-colors">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
                                    </svg>
                                </div>
                                <span class="font-medium">Change Password</span>
                            </button>
                        </div>

                        <div class="my-1 border-t border-slate-200/60 dark:border-slate-700/60 mx-4"></div>

                        <!-- Logout -->
                        <div class="px-2 py-1 pb-2">
                            <button @click="logout()"
                                class="w-full group flex items-center gap-3 px-3 py-2 text-sm text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-900/10 rounded-md transition-colors"
                                role="menuitem">
                                <div class="p-1.5 rounded-md bg-rose-50 dark:bg-rose-900/20 text-rose-500 dark:text-rose-400 group-hover:text-rose-600 dark:group-hover:text-rose-300 transition-colors">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                                    </svg>
                                </div>
                                <span class="font-medium">Sign Out</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div class="md:hidden py-4 border-t border-slate-200 dark:border-slate-800">
            <div class="flex flex-wrap gap-2">
                <a href="/dashboard" class="px-3 py-1.5 rounded-md text-sm font-medium {{if eq .ActivePage "dashboard"}}bg-primary-100 dark:bg-primary-900/20 text-primary-700 dark:text-primary-300{{else}}text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800{{end}}">Dashboard</a>
                <a href="/applications" class="px-3 py-1.5 rounded-md text-sm font-medium text-slate-400 dark:text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center gap-1">Applications <span class="text-[9px] px-1 py-0.5 rounded bg-primary-100 dark:bg-primary-900/30 text-primary-600 dark:text-primary-400">Soon</span></a>
                <a href="/files" class="px-3 py-1.5 rounded-md text-sm font-medium text-slate-400 dark:text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center gap-1">Files <span class="text-[9px] px-1 py-0.5 rounded bg-primary-100 dark:bg-primary-900/30 text-primary-600 dark:text-primary-400">Soon</span></a>
                <a href="/services" class="px-3 py-1.5 rounded-md text-sm font-medium text-slate-400 dark:text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center gap-1">Services <svg class="w-3 h-3 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg></a>
            </div>
        </div>
    </div>
</nav>
{{end}}
