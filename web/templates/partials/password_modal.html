{{define "partials/password_modal"}}
<!-- Change Password Modal -->
<div x-show="showPasswordModal" x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    @keydown.escape.window="showPasswordModal = false"
    class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50" x-cloak>
    <div class="bg-white dark:bg-surface-dark-secondary rounded-md shadow-2xl p-6 w-full max-w-md mx-4 border border-slate-200 dark:border-slate-700"
        x-show="showPasswordModal" x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 scale-95 translate-y-4"
        x-transition:enter-end="opacity-100 scale-100 translate-y-0"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100 scale-100 translate-y-0"
        x-transition:leave-end="opacity-0 scale-95 translate-y-4" @click.away="showPasswordModal = false">
        <div class="flex items-center mb-6">
            <div class="w-10 h-10 bg-amber-50 dark:bg-amber-900/20 rounded-md flex items-center justify-center mr-3 text-amber-600 dark:text-amber-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
                </svg>
            </div>
            <div>
                <h2 class="text-xl font-bold text-slate-900 dark:text-white">Change Password</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Update your admin credentials</p>
            </div>
        </div>
        <form @submit.prevent="changePassword">
            <div class="space-y-4">
                <div>
                    <label class="block text-slate-700 dark:text-slate-300 text-sm font-medium mb-1.5">Current Password</label>
                    <input type="password" x-model="passwordForm.current"
                        class="w-full bg-slate-50 dark:bg-surface-dark-tertiary/50 border border-slate-200 dark:border-slate-700 rounded-md px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 transition-all text-slate-900 dark:text-white"
                        placeholder="Enter current password" required>
                </div>
                <div>
                    <label class="block text-slate-700 dark:text-slate-300 text-sm font-medium mb-1.5">New Password</label>
                    <input type="password" x-model="passwordForm.new"
                        class="w-full bg-slate-50 dark:bg-surface-dark-tertiary/50 border border-slate-200 dark:border-slate-700 rounded-md px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 transition-all text-slate-900 dark:text-white"
                        placeholder="Enter new password (min 8 chars)" required>
                </div>
            </div>
            <div class="flex justify-end space-x-3 mt-8">
                <button type="button" @click="showPasswordModal = false; passwordForm = {current: '', new: ''}"
                    class="px-4 py-2 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white font-medium transition-colors">Cancel</button>
                <button type="submit"
                    class="bg-amber-600 hover:bg-amber-700 text-white px-6 py-2 rounded-md font-medium shadow-lg shadow-amber-500/20 transition-all">Update Password</button>
            </div>
        </form>
    </div>
</div>
{{end}}
