<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetCtrl - Login</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="preload" href="/static/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link href="/static/css/fonts.css" rel="stylesheet">
    <script>
        // Apply theme immediately to prevent flash
        (function () {
            const theme = localStorage.getItem('fleetctrl-theme');
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <script src="/static/js/app.js"></script>
    <script defer src="/static/js/alpine.min.js"></script>
</head>

<body
    class="bg-surface-light-secondary dark:bg-surface-dark text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center transition-all duration-300 font-sans antialiased selection:bg-primary-500 selection:text-white relative overflow-hidden">

    <!-- Background Decoration -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div
            class="absolute -top-[20%] -left-[10%] w-[70%] h-[70%] bg-gradient-to-br from-primary-500/20 to-indigo-500/0 rounded-full blur-3xl opacity-50 dark:opacity-20">
        </div>
        <div class="absolute top-[30%] -right-[10%] w-[50%] h-[50%] bg-gradient-to-bl from-indigo-500/20 to-primary-500/0 rounded-full blur-3xl opacity-50 dark:opacity-20"></div>
    </div>

    <!-- Theme Toggle (Top Right) -->
    <button onclick="ThemeManager.toggle()"
        class="absolute top-6 right-6 p-2.5 rounded-md bg-white/80 dark:bg-surface-dark-secondary/80 backdrop-blur-sm shadow-soft hover:shadow-soft-lg transition-all duration-200 text-slate-500 hover:text-primary-600 dark:text-slate-400 dark:hover:text-primary-400 z-50 border border-slate-200/50 dark:border-slate-700/50"
        title="Toggle theme">
        <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
    </button>

    <div class="w-full max-w-md px-4 z-10" x-data="loginForm()" x-init="init()">
        <div
            class="bg-white/80 dark:bg-surface-dark-secondary/80 backdrop-blur-xl rounded-md shadow-2xl p-8 transition-colors duration-300 border border-white/20 dark:border-slate-700/50 animate-fade-in">
            <!-- Logo and Title -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 mb-5 transform transition-transform hover:scale-105 duration-300">
                    <svg width="100%" height="100%" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="10" y="10" width="38" height="45" rx="6" fill="#60A5FA" />
                        <rect x="10" y="60" width="38" height="30" rx="6" fill="#BFDBFE" />
                        <rect x="53" y="10" width="37" height="30" rx="6" fill="#93C5FD" />
                        <rect x="53" y="45" width="37" height="45" rx="6" fill="#3B82F6" />
                    </svg>
                </div>
                <h1
                    class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-slate-900 to-slate-700 dark:from-white dark:to-slate-300 tracking-tight">
                    FleetCtrl</h1>
                <p class="text-slate-500 dark:text-slate-400 mt-2 text-sm font-medium">Orchestrate your infrastructure
                </p>
                <p class="text-slate-400 dark:text-slate-500 mt-1 text-xs font-mono" x-text="'v' + version"></p>
            </div>

            <form @submit.prevent="login" class="space-y-5">
                <div>
                    <label class="block text-slate-700 dark:text-slate-300 text-sm font-semibold mb-2 ml-1"
                        for="username">Username</label>
                    <div class="relative group">
                        <div
                            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary-500 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                        <input type="text" id="username" x-model="username"
                            class="w-full bg-slate-50 dark:bg-surface-dark-tertiary/50 border border-slate-200 dark:border-slate-700/50 rounded-md pl-11 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary-500/50 focus:border-primary-500 transition-all duration-200 text-slate-900 dark:text-white placeholder-slate-400 font-medium"
                            required>
                    </div>
                </div>

                <div>
                    <label class="block text-slate-700 dark:text-slate-300 text-sm font-semibold mb-2 ml-1"
                        for="password">Password</label>
                    <div class="relative group">
                        <div
                            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary-500 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                                </path>
                            </svg>
                        </div>
                        <input type="password" id="password" x-model="password"
                            class="w-full bg-slate-50 dark:bg-surface-dark-tertiary/50 border border-slate-200 dark:border-slate-700/50 rounded-md pl-11 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary-500/50 focus:border-primary-500 transition-all duration-200 text-slate-900 dark:text-white placeholder-slate-400 font-medium"
                            required>
                    </div>
                </div>

                <div x-show="error" x-cloak x-transition:enter="transition ease-out duration-200"
                    x-transition:enter-start="opacity-0 -translate-y-2"
                    x-transition:enter-end="opacity-100 translate-y-0"
                    class="p-4 bg-rose-50 dark:bg-rose-900/20 border border-rose-100 dark:border-rose-900/30 rounded-md flex items-start gap-3">
                    <svg class="w-5 h-5 text-rose-500 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <p class="text-rose-600 dark:text-rose-400 text-sm font-medium" x-text="error"></p>
                </div>

                <button type="submit"
                    class="relative w-full bg-gradient-to-r from-primary-600 to-indigo-600 hover:from-primary-700 hover:to-indigo-700 text-white font-bold py-3.5 px-4 rounded-md transition-all duration-200 shadow-lg shadow-primary-500/30 hover:shadow-xl hover:shadow-primary-500/40 transform hover:-translate-y-0.5 disabled:opacity-70 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none mt-2"
                    :disabled="loading || authenticated">
                    <span class="flex items-center justify-center" :class="loading ? 'invisible' : ''">
                        Sign In
                        <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
                        </svg>
                    </span>
                    <span x-show="loading" x-cloak class="flex items-center justify-center absolute inset-0">
                        <svg class="animate-spin w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                        Authenticating...
                    </span>
                </button>
            </form>
        </div>

        <!-- <p class="text-center text-slate-400/80 dark:text-slate-500 text-xs mt-8">
            &copy; 2025 FleetCtrl. Secure Access.
        </p> -->
    </div>

    <script>
        function loginForm() {
            return {
                username: '',
                password: '',
                error: '',
                loading: false,
                authenticated: false,
                version: '',

                async init() {
                    try {
                        const response = await fetch('/api/version');
                        const data = await response.json();
                        this.version = data.version || 'dev';
                    } catch (e) {
                        this.version = 'dev';
                    }
                },

                async login() {
                    this.loading = true;
                    this.error = '';

                    try {
                        const response = await fetch('/api/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: this.username,
                                password: this.password
                            })
                        });

                        const data = await response.json();

                        if (response.ok) {
                            this.authenticated = true;
                            localStorage.setItem('token', data.token);
                            localStorage.setItem('tokenExpiry', data.expires_at);
                            window.location.href = data.default_page || '/dashboard';
                        } else {
                            this.error = data.error || 'Login failed';
                            this.loading = false;
                        }
                    } catch (e) {
                        this.error = 'Connection error. Please try again.';
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</body>

</html>
